<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社交力大考验 - 你有多会做人？</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 首页 -->
        <section id="home-page" class="page active">
            <div class="hero">
                <h1>社交力大考验</h1>
                <p class="subtitle">测测你的社会化程度，看看你是社恐还是社牛！</p>
                <div class="mascot">🎭</div>
                <button class="btn-start" onclick="app.startQuiz()">开始测试</button>
                <p class="hint">18题 · 5分钟 · 无登录 · 做完即看结果</p>
            </div>
        </section>

        <!-- 答题页 -->
        <section id="quiz-page" class="page">
            <div class="quiz-header">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="question-counter">
                    <span id="current-num">1</span> / <span id="total-num">18</span>
                </div>
            </div>
            
            <div class="question-card" id="question-card">
                <div class="question-type" id="question-type">情景题</div>
                <h2 class="question-text" id="question-text"></h2>
                <div class="options" id="options"></div>
            </div>
        </section>

        <!-- 结果页 -->
        <section id="result-page" class="page">
            <div class="result-card">
                <div class="result-level" id="result-level"></div>
                <h2 class="result-title" id="result-title"></h2>
                <p class="result-desc" id="result-desc"></p>
                <p class="result-tagline" id="result-tagline" style="font-style:italic;color:#888;margin:8px 0;"></p>
                <div class="rarity-badges" style="display:flex;gap:10px;justify-content:center;margin:12px 0;flex-wrap:wrap;">
                    <span class="badge rarity" id="result-rarity" style="background:#ff6b6b;color:#fff;padding:4px 12px;border-radius:20px;font-size:13px;"></span>
                    <span class="badge beat" id="result-beat" style="background:#4ecdc4;color:#fff;padding:4px 12px;border-radius:20px;font-size:13px;"></span>
                </div>
                
                <div class="score-breakdown">
                    <h3>维度得分</h3>
                    <div class="dimension" id="dim-emotion">
                        <span class="dim-name">情绪管理</span>
                        <div class="dim-bar"><div class="dim-fill"></div></div>
                        <span class="dim-score"></span>
                    </div>
                    <div class="dimension" id="dim-social">
                        <span class="dim-name">社交技巧</span>
                        <div class="dim-bar"><div class="dim-fill"></div></div>
                        <span class="dim-score"></span>
                    </div>
                    <div class="dimension" id="dim-rules">
                        <span class="dim-name">规则理解</span>
                        <div class="dim-bar"><div class="dim-fill"></div></div>
                        <span class="dim-score"></span>
                    </div>
                    <div class="dimension" id="dim-self">
                        <span class="dim-name">自我认知</span>
                        <div class="dim-bar"><div class="dim-fill"></div></div>
                        <span class="dim-score"></span>
                    </div>
                    <div class="dimension" id="dim-context">
                        <span class="dim-name">情境判断</span>
                        <div class="dim-bar"><div class="dim-fill"></div></div>
                        <span class="dim-score"></span>
                    </div>
                </div>

                <div class="upgrade-tips" id="upgrade-tips"></div>

                <div class="share-section">
                    <p>分享你的物种鉴定结果：</p>
                    <div class="share-text" id="share-text"></div>
                    <button class="btn-copy" onclick="app.copyResult()">复制文案</button>
                    <p style="margin-top:12px;font-size:13px;color:#888;">太准了？<a href="#" onclick="alert('请手动@你的朋友来测！');return false;" style="color:#ff6b6b;">@三个朋友来测</a></p>
                </div>

                <button class="btn-restart" onclick="app.restart()">再测一次</button>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
